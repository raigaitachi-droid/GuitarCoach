[package]
name = "guitarcoach"
version = "0.0.0"
description = "Native low-latency audio host for GuitarCoach"
authors = ["GuitarCoach"]
edition = "2021"

[lib]
name = "guitarcoach_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
